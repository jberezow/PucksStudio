[project]
name = "pucksstudio"
version = "0.1.0"
description = "Read-only NHL analytics and visualization backend for PucksData"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "polars>=1.30,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pucksstudio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
